name: revng PE to ARM64 execution proof (toy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revng-pe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate independent synthetic x86 PE
        run: |
          mkdir -p /tmp/revng-input
          python scripts/toy_pe_lifter.py --fixture /tmp/revng-input/toy.exe
          python scripts/inspect_pe.py /tmp/revng-input/toy.exe
      - name: Fetch official rev.ng container
        run: docker pull revng/revng
      - name: Decompile real PE through rev.ng
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/revng-input:/input revng/revng \
            revng quick artifact emit-c-as-single-file /input/toy.exe -o /input/toy.ptml
          test -s /tmp/revng-input/toy.ptml
      - name: Convert PTML into plain decompiled C
        run: |
          docker run --rm -v /tmp/revng-input:/input revng/revng \
            revng ptml -p /input/toy.ptml -o /input/toy.c
          test -s /tmp/revng-input/toy.c
          echo 'Recovered function:'
          cat /tmp/revng-input/toy.c
      - name: Compile actual recovered C and execute under ARM64 QEMU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
          cat > /tmp/revng-input/types-and-globals.h <<'EOF'
          #pragma once
          #include <stdint.h>
          typedef uint32_t generic32_t;
          #define _ABI(x)
          EOF
          touch /tmp/revng-input/helpers.h
          cat > /tmp/revng-input/driver.c <<'EOF'
          #include "types-and-globals.h"
          #include <stdio.h>
          extern generic32_t function_0x401000_Code_x86(void);
          int main(void) {
            unsigned int value = function_0x401000_Code_x86();
            printf("%u\n", value);
            return value == 42 ? 0 : 1;
          }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -I/tmp/revng-input \
            /tmp/revng-input/toy.c /tmp/revng-input/driver.c \
            -o /tmp/revng-input/toy-arm64
          file /tmp/revng-input/toy-arm64
          test "$(qemu-aarch64 /tmp/revng-input/toy-arm64)" = "42"
          echo 'PASS: rev.ng-generated C function executed on ARM64 Linux and returned 42'
      - name: Upload inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: revng-toy-pe-arm64-proof
          path: |
            /tmp/revng-input/toy.ptml
            /tmp/revng-input/toy.c
          if-no-files-found: error
          retention-days: 7

# Scope: fabricated x86 PE with one constant-return function.
# The tiny prototype shim is specific to this fixture.
# NOT an IW5 lift, not native iOS runtime, and not game conversion.

  ios-lifted-object:
    name: Compile revng C to iOS Mach-O (not playable)
    needs: revng-pe
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: revng-toy-pe-arm64-proof
          path: recovered
      - name: Compile recovered toy C using iPhoneOS SDK
        run: |
          set -eux
          cat > recovered/types-and-globals.h <<'EOF'
          #pragma once
          #include <stdint.h>
          typedef uint32_t generic32_t;
          #define _ABI(x)
          EOF
          touch recovered/helpers.h
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 \
            -isysroot "$SDK" -std=c11 -O2 -Irecovered \
            -c recovered/toy.c -o recovered/toy-ios-arm64.o
          file recovered/toy-ios-arm64.o | grep -E 'Mach-O.*arm64'
          echo 'PASS: same rev.ng recovered toy function built as iOS arm64 Mach-O object'
      - uses: actions/upload-artifact@v4
        with:
          name: revng-toy-ios-arm64-object
          path: recovered/toy-ios-arm64.o
          if-no-files-found: error
          retention-days: 7

# The iOS artifact is an object file, not an app or executable.
